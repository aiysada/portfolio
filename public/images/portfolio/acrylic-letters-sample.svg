<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <filter id="haloGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="halo" />
      <feMerge>
        <feMergeNode in="halo" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#wallBg)" />
  <!-- Marble slate lines -->
  <line x1="200" y1="0" x2="200" y2="600" stroke="#27272a" stroke-width="1.5" />
  <line x1="600" y1="0" x2="600" y2="600" stroke="#27272a" stroke-width="1.5" />

  <!-- 3D Letters with Warm Backlight Glow -->
  <g filter="url(#haloGlow)">
    <!-- Backlight aura -->
    <text x="400" y="280" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="88" fill="#f59e0b" opacity="0.3" text-anchor="middle" letter-spacing="4">
      INDIE SIGN
    </text>
    <!-- 3D Extrusion Shadow -->
    <text x="404" y="284" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="88" fill="#451a03" text-anchor="middle" letter-spacing="4">
      INDIE SIGN
    </text>
    <!-- Golden Metallic Front Face -->
    <text x="400" y="280" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="88" fill="url(#gold)" text-anchor="middle" letter-spacing="4">
      INDIE SIGN
    </text>
  </g>

  <!-- Lao Description Underneath -->
  <text x="400" y="360" font-family="'Noto Sans Lao', sans-serif" font-weight="700" font-size="22" fill="#fafafa" text-anchor="middle">
    ປ້າຍຕົວອັກສອນສະແຕນເລດ 3D ໄຟອອກຫຼັງ
  </text>
  <text x="400" y="395" font-family="'Noto Sans Lao', sans-serif" font-weight="500" font-size="15" fill="#a1a1aa" text-anchor="middle">
    304 Mirror Gold with Warm White Halo-lit • ຕົວຢ່າງຜົນງານ
  </text>
  <rect x="330" y="420" width="140" height="26" rx="13" fill="#eab308" opacity="0.15" />
  <text x="400" y="437" font-family="'Noto Sans Lao', sans-serif" font-size="12" fill="#fbbf24" text-anchor="middle">SAMPLE DEMO</text>
</svg>
