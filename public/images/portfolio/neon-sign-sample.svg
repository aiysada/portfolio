<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="brickBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#brickBg)" />

  <!-- Acrylic Backplate Contour -->
  <rect x="180" y="140" width="440" height="300" rx="28" fill="#27272a" opacity="0.4" stroke="#3f3f46" stroke-width="2" />

  <!-- Neon Glowing Tubes -->
  <g filter="url(#neonGlow)">
    <!-- Coffee Cup Outline in Neon -->
    <path d="M340 230 C340 270 420 270 420 230 Z" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round" />
    <path d="M420 240 C435 240 445 250 435 260 C425 265 420 260 420 260" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round" />
    <path d="M365 210 C365 200 375 195 375 185" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round" />
    <path d="M390 210 C390 200 400 195 400 185" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round" />

    <!-- Neon Text in Script Style -->
    <text x="400" y="340" font-family="'Plus Jakarta Sans', cursive, sans-serif" font-weight="900" font-size="44" fill="#ffedd5" stroke="#f97316" stroke-width="4" text-anchor="middle">
      Good Vibes
    </text>
  </g>

  <!-- Typography Description -->
  <text x="400" y="390" font-family="'Noto Sans Lao', sans-serif" font-weight="700" font-size="20" fill="#fafafa" text-anchor="middle">
    ປ້າຍໄຟນີອອນດັດ LED (Neon Flex)
  </text>
  <text x="400" y="420" font-family="'Noto Sans Lao', sans-serif" font-weight="500" font-size="14" fill="#a1a1aa" text-anchor="middle">
    Custom LED Neon Flex on Acrylic • ຕົວຢ່າງຜົນງານ
  </text>
</svg>
