<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="boxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Wall Texture -->
  <rect width="800" height="600" fill="url(#bg1)" />
  <line x1="0" y1="200" x2="800" y2="200" stroke="#334155" stroke-width="2" />
  <line x1="0" y1="400" x2="800" y2="400" stroke="#334155" stroke-width="2" />

  <!-- Lightbox Frame -->
  <rect x="180" y="140" width="440" height="300" rx="24" fill="#020617" stroke="#475569" stroke-width="8" />
  
  <!-- Glowing Face -->
  <rect x="200" y="160" width="400" height="260" rx="16" fill="#090d16" stroke="url(#glow)" stroke-width="4" filter="url(#boxGlow)" />

  <!-- Logo and Typography Inside Lightbox -->
  <circle cx="400" cy="240" r="42" fill="url(#glow)" opacity="0.9" />
  <path d="M380 240 L400 215 L420 240 L400 265 Z" fill="#ffffff" />
  
  <text x="400" y="325" font-family="'Noto Sans Lao', sans-serif" font-weight="800" font-size="28" fill="#ffffff" text-anchor="middle">
    INDIE SIGN CAFE
  </text>
  <text x="400" y="360" font-family="'Noto Sans Lao', sans-serif" font-weight="500" font-size="16" fill="#f97316" text-anchor="middle">
    ປ້າຍກ່ອງໄຟ LED ອາລູມີນຽມ • ຕົວຢ່າງຜົນງານ
  </text>
  <rect x="340" y="380" width="120" height="24" rx="12" fill="#f97316" opacity="0.2" />
  <text x="400" y="396" font-family="'Noto Sans Lao', sans-serif" font-size="12" fill="#fb923c" text-anchor="middle">SAMPLE DEMO</text>
</svg>
