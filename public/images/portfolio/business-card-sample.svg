<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="woodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#woodBg)" />

  <!-- First Business Card (Orange Back) -->
  <g transform="rotate(-6 350 280)" filter="url(#cardShadow)">
    <rect x="180" y="160" width="340" height="200" rx="10" fill="#f97316" stroke="#ea580c" stroke-width="2" />
    <circle cx="350" cy="240" r="32" fill="#ffffff" opacity="0.95" />
    <text x="350" y="248" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="24" fill="#f97316" text-anchor="middle">IS</text>
    <text x="350" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      INDIE SIGN
    </text>
  </g>

  <!-- Second Business Card (Black Front Face) -->
  <g transform="rotate(4 450 300)" filter="url(#cardShadow)">
    <rect x="280" y="190" width="340" height="200" rx="10" fill="#09090b" stroke="#3f3f46" stroke-width="1.5" />
    <rect x="280" y="190" width="10" height="200" fill="#f97316" />
    
    <text x="315" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#fafafa">
      KHAMPHOUVANH
    </text>
    <text x="315" y="260" font-family="'Noto Sans Lao', sans-serif" font-weight="500" font-size="12" fill="#f97316">
      ຜູ້ຈັດການ / Signage Specialist
    </text>
    
    <line x1="315" y1="280" x2="580" y2="280" stroke="#27272a" stroke-width="1" />

    <text x="315" y="305" font-family="'Noto Sans Lao', sans-serif" font-size="11" fill="#a1a1aa">
      WhatsApp: +856 20 5856 3868
    </text>
    <text x="315" y="325" font-family="'Noto Sans Lao', sans-serif" font-size="11" fill="#a1a1aa">
      Facebook: Indie Sign Laos
    </text>
  </g>

  <!-- Tag -->
  <text x="400" y="470" font-family="'Noto Sans Lao', sans-serif" font-weight="700" font-size="20" fill="#fafafa" text-anchor="middle">
    ງານພິມນາມບັດພຣີມຽມ & ໃບປິວ
  </text>
  <text x="400" y="500" font-family="'Noto Sans Lao', sans-serif" font-weight="500" font-size="14" fill="#a1a1aa" text-anchor="middle">
    Art Card 300gsm with Soft-touch Matte Laminate • ຕົວຢ່າງຜົນງານ
  </text>
</svg>
